# Phase 1 of tasks/github-actions-format-ci.md.
#
# Governing principle: CI is a THIN WRAPPER over the make/Dockerfile system.
# This workflow does nothing but `checkout` -> `make check-format`; all the
# logic (build the image, run ruff + ty in the container, fail on a git diff)
# lives in the Makefile + Dockerfile, so the maintainer reproduces exactly what
# CI does by running the same `make` command locally.
#
# The runner is ubuntu-latest (ships Docker); the mvp Makefile's CONTAINER_CMD
# auto-detects podman->docker, so the identical target runs here and on the
# maintainer's podman host.  The image is built in-workflow from the committed
# Dockerfile (self-contained, no registry needed for phase 1), lean: the
# format/ty check needs no docs/emacs/jupyter/X.
name: format-check

on:
  push:
  pull_request:

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check-format
        run: >-
          make check-format
          BUILD_DOCS=0 USE_EMACS=0 USE_JUPYTER=0 USE_X_WINDOWS=0
