[pytest]
pythonpath = src
markers =
    slow: heavy/long-running tests (e.g. free-symbol symbolic proofs); deselected by default, run with `pytest -m slow` (or `pytest -m ""` for everything)
; Doctests in the library are part of the suite -- a docstring example that no
; longer runs is a broken example in the book.  A unit test is a doctest by
; default; tests/ keeps only the cases a doctest cannot express.
;
; `--doctest-modules` *imports* whatever it collects, so the runnable programs
; are excluded by the --ignore options below; every other module under src/ is
; collected, so a new library module's doctests run with no edit here.  The
; excluded programs cannot be made import-safe without changing the book:
;   - demos/ deliberately end their imports with
;     `if __name__ != "__main__": sys.exit(...)`, so the chapter listings read
;     top to bottom as flat programs; sys.exit at import kills pytest with
;     INTERNALERROR, not a test failure;
;   - notebooksrc/ are jupytext notebooks that run their cells at import;
;   - mvpvisualization/ and wxapp*.py open windows.
testpaths =
    tests
    src
addopts = -m "not slow" --doctest-modules
    --ignore=src/modelviewprojection/demos
    --ignore=src/modelviewprojection/notebooksrc
    --ignore=src/modelviewprojection/mvpvisualization
    --ignore-glob=src/modelviewprojection/wxapp*.py
